    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (
                e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(String.fromCharCode(e.keyCode))) ||
                (e.ctrlKey && ['U','S'].includes(String.fromCharCode(e.keyCode)))
            ) return false;
        };

        /* ===== ESTRELLAS TWINKLE DEL INTRO ===== */
        (function() {
            const cv  = document.getElementById('stars-canvas');
            const ctx = cv.getContext('2d');
            let stars = [], raf;

            function resize() {
                cv.width  = window.innerWidth;
                cv.height = window.innerHeight;
            }

            function makeStars() {
                stars = [];
                const n = Math.floor((cv.width * cv.height) / 3000) + 200;
                for (let i = 0; i < n; i++) {
                    stars.push({
                        x:     Math.random() * cv.width,
                        y:     Math.random() * cv.height,
                        r:     Math.random() * 1.5 + 0.15,
                        alpha: Math.random(),
                        speed: Math.random() * 0.007 + 0.002,
                        dir:   Math.random() < 0.5 ? 1 : -1,
                        blue:  Math.random() < 0.12
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, cv.width, cv.height);
                for (const s of stars) {
                    s.alpha += s.speed * s.dir;
                    if (s.alpha > 1)    { s.alpha = 1;    s.dir = -1; }
                    if (s.alpha < 0.04) { s.alpha = 0.04; s.dir =  1; }
                    const color = s.blue
                        ? `hsl(338,100%,${75+Math.random()*20}%)`
                        : `hsl(0,0%,${85+Math.random()*15}%)`;
                    ctx.save();
                    ctx.globalAlpha = s.alpha;
                    ctx.fillStyle   = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur  = s.r * 5;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                raf = requestAnimationFrame(draw);
            }

            window.stopIntroStars = function() {
                cancelAnimationFrame(raf);
                cv.style.display = 'none';
            };

            resize();
            makeStars();
            draw();
            window.addEventListener('resize', () => { resize(); makeStars(); });
        })();
    </script>

    function createBlackHole() {
        const bh = CONFIG.blackHole, rg = CONFIG.accretionRing;
        sphereMaterial = new THREE.ShaderMaterial({
            uniforms: { uTime:{value:0}, uColor1:{value:new THREE.Color(bh.color1)}, uColor2:{value:new THREE.Color(bh.color2)} },
            vertexShader:   `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `uniform float uTime; uniform vec3 uColor1,uColor2; varying vec2 vUv;
                float noise(vec2 s){ return fract(sin(dot(s,vec2(12.9898,78.233)))*43758.5453123); }
                void main(){ float n=noise(vUv*4.0+uTime*0.1); gl_FragColor=vec4(mix(uColor1,uColor2,n),1.0); }`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(bh.radius,bh.segments,bh.segments), sphereMaterial));

        const rm = new THREE.ShaderMaterial({
            uniforms: {
                innerRadius:{value:rg.innerRadius}, outerRadius:{value:rg.outerRadius},
                centerColor:{value:new THREE.Color(rg.centerColor)}, midColor:{value:new THREE.Color(rg.midColor)},
                edgeColor:{value:new THREE.Color(rg.edgeColor)}, emissiveIntensity:{value:rg.emissiveIntensity}
            },
            vertexShader:   `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `uniform float innerRadius,outerRadius,emissiveIntensity;
                uniform vec3 centerColor,midColor,edgeColor; varying vec3 vPos;
                void main(){
                    float d=length(vPos.xy), t=clamp((d-innerRadius)/(outerRadius-innerRadius),0.0,1.0);
                    vec3 col=t<0.5?mix(centerColor,midColor,t*2.0):mix(midColor,edgeColor,(t-0.5)*2.0);
                    float g=1.0-smoothstep(0.0,1.0,t);
                    gl_FragColor=vec4(col+col*emissiveIntensity*g,1.0);
                }`,
            side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(new THREE.RingGeometry(rg.innerRadius,rg.outerRadius,rg.segments), rm);
        ring.rotation.x = Math.PI/2;
        scene.add(ring);
    }

    function createHeartStars() {
        const hc=CONFIG.heartStars, pos=[];
        // Contorno denso del corazón (mayoría de puntos)
        const outlineCount = Math.floor(hc.count * 0.75);
        for (let i=0;i<outlineCount;i++) {
            const t=(i/outlineCount)*Math.PI*2;
            const x=16*Math.pow(Math.sin(t),3);
            const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
            // Ruido muy pequeño para que el contorno se vea nítido
            const n=0.08;
            const rx = x*hc.scale/16+(Math.random()-.5)*n*hc.scale;
            const ry = hc.yOffset+y*hc.scale/16*0.85+(Math.random()-.5)*n*hc.scale;
            pos.push(rx, ry, (Math.random()-.5)*0.3);
        }
        // Relleno interior con más densidad
        const fillCount = Math.floor(hc.count * 0.25);
        for (let i=0;i<fillCount;i++) {
            // Muestreo aleatorio dentro del corazón usando rechazo
            let fx, fy;
            let attempts = 0;
            do {
                const t2 = Math.random()*Math.PI*2;
                const r  = Math.random();
                fx = 16*Math.pow(Math.sin(t2),3) * r * hc.scale/16;
                fy = (13*Math.cos(t2)-5*Math.cos(2*t2)-2*Math.cos(3*t2)-Math.cos(4*t2)) * r * hc.scale/16;
                attempts++;
            } while (attempts < 10);
            pos.push(fx, hc.yOffset+fy*0.85, (Math.random()-.5)*0.5);
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
        // Capa principal del corazón
        scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
            size:hc.size, color:new THREE.Color(hc.color),
            blending:THREE.AdditiveBlending, transparent:true, opacity:1.0, sizeAttenuation:true
        })));
        // Segunda capa más grande y translúcida para el resplandor (glow)
        scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
            size:hc.size*3.5, color:new THREE.Color('#4A1024'),
            blending:THREE.AdditiveBlending, transparent:true, opacity:0.18, sizeAttenuation:true
        })));
    }

    function createCoreStars() {
        const cfg=CONFIG.particles.coreStars;
        const pos=new Float32Array(cfg.count*3), col=new Float32Array(cfg.count*3), c=new THREE.Color();
        for (let i=0;i<cfg.count;i++) {
            const dist=CONFIG.accretionRing.outerRadius+Math.random()*(cfg.radius-CONFIG.accretionRing.outerRadius);
            const angle=Math.random()*Math.PI*2;
            const y=(Math.random()-.5)*cfg.maxHeight*Math.pow(1-dist/cfg.radius,1.5);
            pos.set([Math.cos(angle)*dist,y,Math.sin(angle)*dist],i*3);
            c.setHSL((0.82+Math.random()*0.12)%1,0.8+Math.random()*0.2,0.6+Math.random()*0.4);
            col.set([c.r,c.g,c.b],i*3);
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
        geo.setAttribute('color',new THREE.BufferAttribute(col,3));
        galaxyGroup.add(new THREE.Points(geo,new THREE.PointsMaterial({
            size:cfg.size, blending:THREE.AdditiveBlending, vertexColors:true, transparent:true
        })));
    }

    function createSphericalHalo() {
        const cfg=CONFIG.particles.sphericalHalo;
        const pos=new Float32Array(cfg.count*3), col=new Float32Array(cfg.count*3), c=new THREE.Color();
        let filled=0;
        while (filled<cfg.count) {
            const [rx,ry,rz]=[Math.random()*2-1,Math.random()*2-1,Math.random()*2-1];
            if (rx*rx+ry*ry+rz*rz>1) continue;
            const x=rx*cfg.radiusXZ, y=ry*cfg.radiusY, z=rz*cfg.radiusXZ;
            const d=Math.sqrt(x*x+y*y+z*z);
            if (d<cfg.minDistFromCenter) continue;
            const rN=d/Math.max(cfg.radiusXZ,cfg.radiusY);
            if (Math.random()>Math.pow(1-rN*0.7,1.2)) continue;
            pos.set([x,y,z],filled*3);
            c.setHSL((0.82+Math.random()*0.12)%1,0.6+Math.random()*0.4,0.45+Math.random()*0.45);
            col.set([c.r,c.g,c.b],filled*3);
            filled++;
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
        geo.setAttribute('color',new THREE.BufferAttribute(col,3));
        galaxyGroup.add(new THREE.Points(geo,new THREE.PointsMaterial({
            size:cfg.size, blending:THREE.AdditiveBlending, vertexColors:true, transparent:true, opacity:0.65
        })));
    }

    function createBackgroundStars() {
        const cfg=CONFIG.particles.backgroundStars;
        const pos=new Float32Array(cfg.count*3);
        for (let i=0;i<cfg.count;i++) {
            // Distribución esférica para que se vean en todas direcciones
            const r=300+Math.random()*cfg.radius;
            const theta=Math.random()*Math.PI*2;
            const phi=Math.acos(2*Math.random()-1);
            pos.set([
                r*Math.sin(phi)*Math.cos(theta),
                r*Math.sin(phi)*Math.sin(theta),
                r*Math.cos(phi)
            ],i*3);
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
        scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
            size:cfg.size, color:0xffffff, transparent:true, opacity:0.55, sizeAttenuation:true
        })));
    }

    function createLoveElements() {
        const tC=CONFIG.particles.texts, eC=CONFIG.particles.emojis;
        const loader = new THREE.TextureLoader();

        // Cada recuerdo es un solo conjunto: fotografía arriba y texto debajo.
        // Al estar dentro de galaxyGroup, ambos giran junto con la galaxia.
        for (let i=0;i<tC.count;i++) {
            const recuerdo=tC.content[i%tC.content.length];
            const cd=tC.colors[i%tC.colors.length];
            const conjunto=new THREE.Group();

            const fotoTexture=loader.load(
                recuerdo.image,
                tex => { tex.colorSpace=THREE.SRGBColorSpace; },
                undefined,
                () => console.warn("No se pudo cargar la foto: "+recuerdo.image)
            );
            const foto=new THREE.Mesh(
                new THREE.PlaneGeometry(25,18),
                new THREE.MeshBasicMaterial({map:fotoTexture,transparent:true,side:THREE.DoubleSide})
            );
            foto.position.y=8;
            conjunto.add(foto);

            const tex=createTextTexture(recuerdo.text,cd);
            const palabra=new THREE.Mesh(
                new THREE.PlaneGeometry(tC.width,tC.height),
                new THREE.MeshPhongMaterial({map:tex,transparent:true,alphaTest:0.1,emissive:cd.fill,emissiveIntensity:1.2,side:THREE.DoubleSide})
            );
            palabra.position.y=-8;
            conjunto.add(palabra);

            setPos(conjunto,tC.minRadius,tC.maxRadius);
            galaxyGroup.add(conjunto);
            loveTexts.push(palabra);
        }
        for (let i=0;i<eC.count;i++) {
            const cd=eC.colors[i%eC.colors.length];
            const tex=createEmojiTexture(eC.content[i%eC.content.length],cd);
            const m=new THREE.Mesh(new THREE.PlaneGeometry(eC.size,eC.size),
                new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:0.1}));
            setPos(m,eC.minRadius,eC.maxRadius);
            galaxyGroup.add(m); loveImages.push(m);
        }
    }

    function setPos(el,minR,maxR) {
        const sMin=minR||CONFIG.elementExclusionRadius, sMax=maxR||CONFIG.particles.coreStars.radius;
        const minDistance = 22;
        let valid=false,tries=0,pos={x:0,y:0,z:0};
        while (!valid&&tries<80) {
            tries++;
            const r=sMin+Math.random()*(sMax-sMin), a=Math.random()*Math.PI*2;
            const y=(Math.random()-.5)*30, x=r*Math.cos(a), z=r*Math.sin(a);
            valid=occupiedPositions.every(p=>Math.sqrt((x-p.x)**2+(y-p.y)**2+(z-p.z)**2)>=minDistance);
            if (valid) pos={x,y,z};
        }
        if (!valid) {
            const idx = occupiedPositions.length;
            const angle = (idx + 1) * (Math.PI * (3 - Math.sqrt(5)));
            const radius = sMin + ((idx % 7) / 7) * (sMax - sMin) + (idx % 3) * 4;
            pos = {
                x: radius * Math.cos(angle),
                y: (Math.random() - 0.5) * 32,
                z: radius * Math.sin(angle)
            };
        }
        el.position.set(pos.x,pos.y,pos.z);
        occupiedPositions.push(pos);
    }

    function createTextTexture(text,color) {
        const cv=document.createElement('canvas'); cv.width=1536; cv.height=512;
        const ctx=cv.getContext('2d');
        ctx.font='84px "Patrick Hand",cursive';
        ctx.fillStyle=color.fill; ctx.shadowColor=color.shadow; ctx.shadowBlur=3;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        const words=text.split(' '); let lines=[],cur=words[0];
        for (let i=1;i<words.length;i++) {
            const t=cur+' '+words[i];
            if (ctx.measureText(t).width>1436&&cur.length>0){lines.push(cur);cur=words[i];}
            else cur=t;
        }
        lines.push(cur);
        const sy=cv.height/2-(lines.length-1)*100/2;
        lines.forEach((l,i)=>ctx.fillText(l,cv.width/2,sy+i*100));
        return new THREE.CanvasTexture(cv);
    }

    function createEmojiTexture(emoji,cd) {
        const cv=document.createElement('canvas'); cv.width=cv.height=512;
        const ctx=cv.getContext('2d');
        ctx.clearRect(0,0,512,512);
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font='320px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
        ctx.shadowColor=cd.shadow; ctx.shadowBlur=24; ctx.fillStyle=cd.fill;
        ctx.fillText(emoji,256,272);
        const t=new THREE.CanvasTexture(cv);
        t.colorSpace=THREE.SRGBColorSpace;
        t.generateMipmaps=false;
        t.minFilter=t.magFilter=THREE.LinearFilter;
        return t;
    }

    function createShootingStar() {
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([0,0,0]),3));
        const star=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:1.8,blending:THREE.AdditiveBlending,transparent:true}));
        star.position.set(THREE.MathUtils.randFloatSpread(800),THREE.MathUtils.randFloat(100,300),THREE.MathUtils.randFloatSpread(800));
        star.userData.velocity=new THREE.Vector3((Math.random()<.5?-1:1)*CONFIG.shootingStars.speed,-CONFIG.shootingStars.speed*.5,(Math.random()-.5)*2);
        star.userData.life=0;
        shootingStars.push(star); scene.add(star);
    }

    function onResize() {
        const w=window.innerWidth, h=window.innerHeight;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, w < 768 ? 1.5 : 2));
        renderer.setSize(w,h); composer.setSize(w,h);
        camera.aspect=w/h;
        camera.position.set(0,35,w<768?150:120);
        camera.updateProjectionMatrix();
    }

    function onCanvasClick(e) {
        mouse.x=(e.clientX/window.innerWidth)*2-1;
        mouse.y=-(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        if (raycaster.intersectObjects(loveImages).length>0) showLoveCard();
    }

    function showLoveCard() {
        const overlay=document.getElementById('love-card-overlay');
        const image=document.getElementById('love-card-image');
        const text=document.getElementById('love-card-text');
        const cfg=CONFIG.loveCards;
        image.src=cfg.images[currentCardIndex];
        text.textContent=cfg.phrases[currentCardIndex%cfg.phrases.length];
        overlay.style.display='flex';
        currentCardIndex=(currentCardIndex+1)%cfg.images.length;
    }

    window.hideLoveCard=function(){ document.getElementById('love-card-overlay').style.display='none'; };

    function animate() {
        requestAnimationFrame(animate);
        const t=clock.getElapsedTime();
        galaxyGroup.rotation.y=t*CONFIG.galaxy.rotationSpeed;
        if (sphereMaterial) sphereMaterial.uniforms.uTime.value=t;
        loveTexts.forEach(m=>m.lookAt(camera.position));
        loveImages.forEach(m=>m.lookAt(camera.position));
        if (CONFIG.shootingStars.enabled&&Math.random()<CONFIG.shootingStars.spawnProbability) createShootingStar();
        shootingStars.forEach((s,i)=>{
            s.position.add(s.userData.velocity);
            if (++s.userData.life>300){ scene.remove(s); shootingStars.splice(i,1); }
        });
        controls.update();
        composer.render();
    }

    const ENTRY_LOCK_KEY = 'cumple-entry-locked-until';
    const entryButton = document.getElementById('entry-button');
    const entryText = document.getElementById('entry-text');
    const birthdayNotes = document.getElementById('birthday-notes');
    const birthdayPhrases = [
        'Que este nuevo año te regale tanta felicidad como la que tú nos das. 💗',
        'Tu manera de ser con nostros hace más bonito cualquier lugar. ✨',
        'Hoy celebro tu cumpleaños, por que eres increíble. ¡Feliz cumpleaños! 🎂',
        'Mereces un universo entero de momentos hermosos. 🌟',
        'Nunca olvides lo increíble, valiente, valiosa y maravillosa que eres. 💖',
        'Que todos tus sueños encuentren el camino para hacerse realidad solo mira hasta donde has llegado. 🌷',
        'Tu forma de ser es uno de los regalos más lindos para quienes te queremos. 🎁',
        'Ojalá hoy recibas todo el cariño que le das al mundo y si te falta cariño are lo mejor de mi por darte todo el que necesitas. 💕',
        'te amamos mucho pollito. 🥳',
        'Feliz cumpleaños a la dueña de un corazón enorme y precioso. 💗'
    ];
    const guessingHints = [
        '¡Upps! Todavía no es la hora, mi vida 😉',
        'Casi... pero todavía falta un poquito 💗',
        '¡Buena intuición! Sigue intentando ✨',
        'Por ahí va la cosa... pero aún no 💞',
        'Un poquito más de paciencia, mi vida 🌹',
        '¿Ya quieres ver tu sorpresa? Todavía toca esperar 💕'
    ];
    let phraseIndex = 0;
    let hintIndex = 0;
    let noteCount = 0;

    function removeBirthdayNote(note) {
        if (!note || !note.isConnected) return;
        note.classList.add('is-leaving');
        window.setTimeout(() => note.remove(), 350);
    }

    function showBirthdayNote() {
        noteCount++;
        if (noteCount % 2 === 0) {
            removeBirthdayNote(birthdayNotes.firstElementChild);
        }

        const note = document.createElement('div');
        note.className = 'birthday-note';
        const phrase = birthdayPhrases[phraseIndex];
        note.textContent = phrase;
        phraseIndex = (phraseIndex + 1) % birthdayPhrases.length;
        entryText.textContent = guessingHints[hintIndex];
        hintIndex = (hintIndex + 1) % guessingHints.length;
        const tilt = (Math.random() * 8 - 4).toFixed(1);
        note.style.setProperty('--note-tilt', `${tilt}deg`);
        note.style.setProperty('--note-drift', `${Math.round(Math.random() * 48 - 24)}px`);
        birthdayNotes.appendChild(note);

        const buttonBounds = entryButton.getBoundingClientRect();
        const noteBounds = note.getBoundingClientRect();
        const horizontalOffset = (Math.random() - 0.5) * Math.min(150, window.innerWidth * 0.35);
        const left = Math.max(12, Math.min(
            window.innerWidth - noteBounds.width - 12,
            buttonBounds.left + buttonBounds.width / 2 - noteBounds.width / 2 + horizontalOffset
        ));
        const top = Math.max(12, Math.min(
            window.innerHeight - noteBounds.height - 12,
            buttonBounds.top - noteBounds.height - 18 + Math.random() * 48
        ));
        note.style.left = `${left}px`;
        note.style.top = `${top}px`;

        if (birthdayNotes.children.length > 2) {
            removeBirthdayNote(birthdayNotes.firstElementChild);
        }

        window.setTimeout(() => removeBirthdayNote(note), 8000);
    }

    function openBirthdayExperience() {
        localStorage.removeItem(ENTRY_LOCK_KEY);
        document.getElementById('entry-modal').style.display = 'none';
        document.getElementById('dark-overlay').style.display = 'none';
        window.stopIntroStars();
        init();

        const music = document.getElementById('background-music');
        music.src = 'Martina%20La%20Peligrosa%20-%20Cafecito%20Para%20Dos.mp3';
        music.load();
        music.addEventListener('loadedmetadata', () => {
            music.currentTime = 0;
            music.play().catch(e => console.warn('Audio:', e));
        }, { once: true });
    }

    function updateEntryLock() {
        const savedUnlockAt = localStorage.getItem(ENTRY_LOCK_KEY);
        if (savedUnlockAt === null) {
            entryButton.disabled = false;
            entryButton.textContent = 'Adivina la hora mi vida';
            entryText.textContent = 'Tienes que adivinar la hora...';
            return;
        }

        const unlockAt = Number(savedUnlockAt);
        if (!Number.isFinite(unlockAt)) {
            localStorage.removeItem(ENTRY_LOCK_KEY);
            entryButton.disabled = false;
            entryButton.textContent = 'Adivina la hora mi vida';
            entryText.textContent = 'Tienes que adivinar la hora...';
            return;
        }

        if (unlockAt <= Date.now()) {
            entryButton.disabled = false;
            entryButton.textContent = 'Tu sorpresa te espera';
            entryText.textContent = 'Parece que ya encontraste la hora...';
            return;
        }

        entryButton.disabled = false;
        entryButton.textContent = 'Adivina la hora mi vida';
        entryText.textContent = 'Tienes que adivinar la hora...';
        window.setTimeout(updateEntryLock, unlockAt - Date.now());
    }

    updateEntryLock();

    entryButton.addEventListener('click', () => {
        const savedUnlockAt = localStorage.getItem(ENTRY_LOCK_KEY);
        if (savedUnlockAt === null) {
            const unlockAt = new Date();
            unlockAt.setDate(unlockAt.getDate() + 1);
            unlockAt.setHours(13, 0, 0, 0);
            localStorage.setItem(ENTRY_LOCK_KEY, String(unlockAt.getTime()));
            updateEntryLock();
            showBirthdayNote();
            return;
        }

        const unlockAt = Number(savedUnlockAt);
        if (!Number.isFinite(unlockAt)) {
            localStorage.removeItem(ENTRY_LOCK_KEY);
            updateEntryLock();
            showBirthdayNote();
            return;
        }

        if (unlockAt > Date.now()) {
            showBirthdayNote();
            return;
        }

        openBirthdayExperience();
    });

    </script>
